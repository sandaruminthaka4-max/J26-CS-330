[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconnaissance-ids"
version = "1.0.0"
description = "Lightweight Multi-Class Reconnaissance Attack Detection for IoMT Networks (CICIoMT2024)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bandara B.R.K.Y", email = "IT23285224@my.sliit.lk" }
]
keywords = [
    "iomt", "reconnaissance", "intrusion-detection", "sdn", 
    "port-scan", "os-scan", "vulnerability-scan", "ping-sweep", 
    "machine-learning", "lightweight-ids", "ciciomt2024"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
